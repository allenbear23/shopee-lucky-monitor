name: Shopee Lucky Monitor

on:
  workflow_dispatch:
  schedule:
    # 每 4 小時一檔（臺北 00:07/04:07/08:07/12:07/16:07/20:07）。
    # 每檔最多跑 6h + --keep-alive：跨過 23:59 換日，自動接上隔天場次，形成 24/7 覆蓋。
    - cron: "7 0,4,8,12,16,20 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 單次 run 最長 6h（活動結束 --keep-alive 會待機不退出，靠下一檔接續）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Shopee Lucky Draw Monitor (24/7 keep-alive)
        env:
          TZ: "Asia/Taipei"
          BARK_KEY: ${{ secrets.BARK_KEY }}
          MONITOR_FLAGS: ${{ vars.MONITOR_FLAGS }}
        run: |
          node monitor.mjs $MONITOR_FLAGS # 預設 --interval 60 --keep-alive（設在 repo variable）