name: Shopee Lucky Monitor

on:
  workflow_dispatch:
  # 已停止雲端監視（2026-10-13）：原 schedule `7 0,4,8,12,16,20 * * *` 已移除。
  # 需要恢復時加上 schedule 或手動 Run workflow。

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 單次 run 最長 6h（活動結束 --keep-alive 會待機不退出，靠下一檔接續）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Shopee Lucky Draw Monitor (24/7 keep-alive)
        env:
          TZ: "Asia/Taipei"
          BARK_KEY: ${{ secrets.BARK_KEY }}
          MONITOR_FLAGS: ${{ vars.MONITOR_FLAGS }}
        run: |
          node monitor.mjs $MONITOR_FLAGS # 預設 --interval 60 --keep-alive（設在 repo variable）